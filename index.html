<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acessibilidade Ocular - Questionário com Voz</title>
    <style>
        /* RESET & ACESSIBILIDADE DE CORES (Contraste em Tons de Azul) */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            text-align: center;
            background-color: #0b131a; /* Fundo azul escuro profundo para reduzir fadiga visual */
            color: #FFFFFF; /* Texto branco puro para leitura limpa */
            user-select: none;
            font-size: 24px; /* Fonte ampliada para baixa visão */
            line-height: 1.6;
        }

        header, footer {
            background-color: #111d28;
            color: #00d2ff; /* Azul ciano vibrante para máximo contraste e destaque */
            padding: 2rem 1rem;
            border-bottom: 4px solid #00d2ff;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 900;
        }

        nav a {
            color: #00d2ff;
            font-size: 1.8rem;
            font-weight: bold;
            text-decoration: underline;
        }

        /* ÁREA PRINCIPAL EXPANDIDA */
        main {
            padding: 1.5rem;
            max-width: 90vw; /* Ocupa quase toda a largura da tela */
            margin: auto;
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h2 {
            font-size: 2.2rem;
            color: #00d2ff;
            margin-bottom: 1.5rem;
        }

        /* CAIXA DE INSTRUÇÕES COM TEMA AZUL */
        .instrucoes {
            background-color: #111d28;
            padding: 25px;
            border: 4px dashed #00d2ff;
            border-radius: 12px;
            margin-bottom: 30px;
            text-align: left;
        }

        .instrucoes p {
            font-size: 1.6rem;
            margin-bottom: 10px;
        }

        .instrucoes strong {
            color: #00d2ff;
        }

        /* CARD DE CLIQUE GIGANTE */
        .pergunta-card {
            background: #162535;
            padding: 40px 20px;
            border-radius: 16px;
            border: 5px solid #3498db; /* Borda azul perceptível */
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.2);
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, transform 0.1s;
            width: 100%;
            min-height: 400px; /* Alvo imenso para cliques fáceis */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Feedback visual ao passar o mouse */
        .pergunta-card:hover {
            background: #1c3045;
            border-color: #00d2ff;
        }

        .pergunta-card:active {
            transform: scale(0.99);
        }

        /* ÍCONE DE ACESSIBILIDADE OTIMIZADO */
        .img-simbolo {
            width: 100%;
            max-width: 250px;
            height: auto;
            margin-bottom: 30px;
            filter: drop-shadow(0px 0px 8px rgba(0, 210, 255, 0.4));
        }

        #texto-pergunta {
            font-size: 2.2rem; /* Fonte gigante para a pergunta */
            font-weight: 800;
            color: #FFFFFF;
            padding: 0 10px;
            word-wrap: break-word;
        }

        /* TELA DE RESULTADOS */
        .respostas-log {
            margin-top: 30px;
            text-align: left;
            background: #111d28;
            padding: 30px;
            border-radius: 12px;
            border: 4px solid #00ff88; /* Borda verde brilhante para o fim */
        }

        .respostas-log h3 {
            font-size: 2rem;
            color: #00ff88;
            margin-bottom: 20px;
        }

        .respostas-log ul {
            list-style-type: square;
            padding-left: 30px;
        }

        .respostas-log li {
            font-size: 1.6rem;
            margin-bottom: 15px;
            border-bottom: 1px solid #1c3045;
            padding-bottom: 10px;
        }
        
        footer {
            margin-top: 40px;
            border-top: 4px solid #00d2ff;
            border-bottom: none;
        }
    </style>
</head>

<body>
    <header>
        <h1>Acessibilidade Ocular</h1>
        <nav>
            <a href="#">Início</a>
        </nav>
    </header>

    <main>
        <h2>Questionário Interativo</h2>
        
        <div class="instrucoes">
            <p><strong>Como responder dentro da área central:</strong></p>
            <p>Clique <strong>ESQUERDO</strong> = NÃO</p>
            <p>Clique <strong>DIREITO</strong> =  SIM</p>
        </div>

        <section>
            <!-- Área de clique acessível -->
            <article class="pergunta-card" id="area-clique" aria-label="Área de clique para resposta">
                <img 
                    src="https://cloudfront-us-east-1.images.arcpublishing.com/estadao/QDNK2LEF4NI5HOKE2JLFTVOGSM.jpg" 
                    alt="Símbolo azul e preto de Acessibilidade Ocular" 
                    class="img-simbolo"
                >
                <p id="texto-pergunta">Carregando pergunta...</p>
            </article>
        </section>

        <div class="respostas-log" id="log-container" style="display: none;">
            <h3>Resultados do Questionário:</h3>
            <ul id="lista-respostas"></ul>
        </div>
    </main>

    <footer>
        <p>Projeto desenvolvido por Oséias</p>
    </footer>

    <script>
        const perguntas = [
            "Você precisa de ajustes de contraste para ler com clareza?",
            "Você utiliza leitores de tela durante a navegação?",
            "Sente facilidade para navegar usando comandos do mouse?",
            "Deseja salvar suas respostas ao final?"
        ];

        let indiceAtual = 0;
        const respostas = [];

        const elementoPergunta = document.getElementById('texto-pergunta');
        const areaClique = document.getElementById('area-clique');
        const logContainer = document.getElementById('log-container');
        const listaRespostas = document.getElementById('lista-respostas');

        // FUNÇÃO DA IA DE VOZ
        function falarTexto(texto) {
            if ('speechSynthesis' in window) {
                // Cancela qualquer fala que esteja acontecendo no momento para não encavalar
                window.speechSynthesis.cancel();

                const mensagem = new SpeechSynthesisUtterance(texto);
                mensagem.lang = 'pt-BR'; // Idioma configurado para português
                mensagem.rate = 1.0;    // Velocidade natural da voz
                mensagem.pitch = 1.0;   // Tom de voz padrão

                window.speechSynthesis.speak(mensagem);
            }
        }

        function atualizarPergunta() {
            if (indiceAtual < perguntas.length) {
                const proximaPergunta = perguntas[indiceAtual];
                elementoPergunta.textContent = proximaPergunta;
                
                // A IA lê a pergunta automaticamente assim que ela muda na tela
                falarTexto(proximaPergunta);
            } else {
                exibirResultados();
            }
        }

        function registrarResposta(resposta) {
            if (indiceAtual < perguntas.length) {
                respostas.push({
                    pergunta: perguntas[indiceAtual],
                    resposta: responseText = resposta
                });
                
                // Feedback por voz rápido para o usuário saber o que clicou
                falarTexto(`Você respondeu: ${resposta}`);
                
                indiceAtual++;
                
                // Aguarda um pequeno instante para a voz de feedback terminar antes da próxima pergunta
                setTimeout(atualizarPergunta, 800);
            }
        }

        // Bloqueia menu e registra SIM
        areaClique.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            registrarResposta('SIM');
        });

        // Intercepta clique esquerdo
        areaClique.addEventListener('click', function(e) {
            if (e.button === 0) {
                registrarResposta('NÃO');
            }
        });

        function exibirResultados() {
            areaClique.style.display = 'none';
            logContainer.style.display = 'block';
            listaRespostas.innerHTML = '';
            
            falarTexto("Questionário concluído. Veja os seus resultados na tela.");
            
            respostas.forEach((item) => {
                const li = document.createElement('li');
                li.innerHTML = `<strong>Pergunta:</strong> ${item.pergunta} <br> <strong>Resposta:</strong> <span style="color: ${item.resposta === 'SIM' ? '#00ff88' : '#ff4a4a'}">${item.resposta}</span>`;
                listaRespostas.appendChild(li);
            });
        }

        // Inicializa o sistema
        atualizarPergunta();
    </script>
</body>
</html>
