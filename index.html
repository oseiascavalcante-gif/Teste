<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acessibilidade Ocular - Questionário Ampliado</title>
    <style>
        /* RESET & ACESSIBILIDADE DE CORES (Contraste Máximo) */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            text-align: center;
            background-color: #000000; /* Fundo preto reduz o cansaço visual e aumenta o contraste */
            color: #FFFFFF; /* Texto branco puro */
            user-select: none;
            font-size: 24px; /* Tamanho base muito maior para baixa visão */
            line-height: 1.6;
        }

        header, footer {
            background-color: #1a1a1a;
            color: #FFFF00; /* Amarelo tem o maior contraste sob fundo escuro */
            padding: 2rem 1rem;
            border-bottom: 4px solid #FFFF00;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 900;
        }

        nav a {
            color: #FFFF00;
            font-size: 1.8rem;
            font-weight: bold;
            text-decoration: underline;
        }

        /* ÁREA PRINCIPAL EXPANDIDA */
        main {
            padding: 1.5rem;
            max-width: 90vw; /* Ocupa quase toda a largura da tela */
            margin: auto;
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h2 {
            font-size: 2.2rem;
            color: #FFFF00;
            margin-bottom: 1.5rem;
        }

        /* CAIXA DE INSTRUÇÕES DESTACADA */
        .instrucoes {
            background-color: #1a1a1a;
            padding: 25px;
            border: 4px dashed #FFFF00;
            border-radius: 12px;
            margin-bottom: 30px;
            text-align: left;
        }

        .instrucoes p {
            font-size: 1.6rem;
            margin-bottom: 10px;
        }

        .instrucoes strong {
            color: #FFFF00;
        }

        /* CARD DE CLIQUE GIGANTE E ACESSÍVEL */
        .pergunta-card {
            background: #111111;
            padding: 40px 20px;
            border-radius: 16px;
            border: 5px solid #3498db; /* Borda azul bem visível */
            box-shadow: 0 0 25px rgba(52, 152, 219, 0.4);
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            width: 100%;
            min-height: 400px; /* Área de alvo vertical imensa */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Feedback visual ao passar o mouse */
        .pergunta-card:hover {
            background: #222222;
            border-color: #FFFF00;
        }

        .pergunta-card:active {
            transform: scale(0.99);
        }

        /* ÍCONE DE ACESSIBILIDADE OTIMIZADO */
        .img-simbolo {
            width: 100%;
            max-width: 250px;
            height: auto;
            margin-bottom: 30px;
            filter: drop-shadow(0px 0px 8px rgba(255, 255, 255, 0.5));
        }

        #texto-pergunta {
            font-size: 2.2rem; /* Fonte gigante para a pergunta */
            font-weight: 800;
            color: #FFFFFF;
            padding: 0 10px;
            word-wrap: break-word;
        }

        /* TELA DE RESULTADOS */
        .respostas-log {
            margin-top: 30px;
            text-align: left;
            background: #111111;
            padding: 30px;
            border-radius: 12px;
            border: 4px solid #2ecc71; /* Borda verde para sucesso */
        }

        .respostas-log h3 {
            font-size: 2rem;
            color: #2ecc71;
            margin-bottom: 20px;
        }

        .respostas-log ul {
            list-style-type: square;
            padding-left: 30px;
        }

        .respostas-log li {
            font-size: 1.6rem;
            margin-bottom: 15px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        
        footer {
            margin-top: 40px;
            border-top: 4px solid #FFFF00;
            border-bottom: none;
        }
    </style>
</head>

<body>
    <header>
        <h1>Acessibilidade Ocular</h1>
        <nav>
            <a href="#">Início</a>
        </nav>
    </header>

    <main>
        <h2>Questionário Interativo</h2>
        
        <div class="instrucoes">
            <p><strong>Como responder dentro da borda azul:</strong></p>
            <p>Qualquer Clique <strong>ESQUERDO</strong> = ❌ NÃO</p>
            <p>Qualquer Clique <strong>DIREITO</strong> =  SIM</p>
        </div>

        <section>
            <!-- A área inteira deste card agora serve como botão gigante -->
            <article class="pergunta-card" id="area-clique" aria-label="Área de clique para resposta">
                <!-- Usando a imagem de acessibilidade que você enviou -->
                <img 
                    src="image_Qtzjut.png" 
                    alt="Símbolo azul e preto de Acessibilidade Ocular" 
                    class="img-simbolo"
                >
                <p id="texto-pergunta">Carregando pergunta...</p>
            </article>
        </section>

        <div class="respostas-log" id="log-container" style="display: none;">
            <h3>Resultados do Questionário:</h3>
            <ul id="lista-respostas"></ul>
        </div>
    </main>

    <footer>
        <p>Projeto desenvolvido por Oséias</p>
    </footer>

    <script>
        const perguntas = [
            "Você precisa de ajustes de contraste para ler com clareza?",
            "Você utiliza leitores de tela durante a navegação?",
            "Sente facilidade para navegar usando comandos do mouse?",
            "Deseja salvar suas respostas ao final?"
        ];

        let indiceAtual = 0;
        const respostas = [];

        const elementoPergunta = document.getElementById('texto-pergunta');
        const areaClique = document.getElementById('area-clique');
        const logContainer = document.getElementById('log-container');
        const listaRespostas = document.getElementById('lista-respostas');

        function atualizarPergunta() {
            if (indiceAtual < perguntas.length) {
                elementoPergunta.textContent = perguntas[indiceAtual];
            } else {
                exibirResultados();
            }
        }

        function registrarResposta(resposta) {
            if (indiceAtual < perguntas.length) {
                respostas.push({
                    pergunta: perguntas[indiceAtual],
                    resposta: resposta
                });
                indiceAtual++;
                atualizarPergunta();
            }
        }

        // Impede o menu de contexto padrão e registra SIM
        areaClique.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            registrarResposta('SIM');
        });

        // Intercepta o clique esquerdo em qualquer lugar do card gigante
        areaClique.addEventListener('click', function(e) {
            if (e.button === 0) {
                registrarResposta('NÃO');
            }
        });

        function exibirResultados() {
            areaClique.style.display = 'none';
            logContainer.style.display = 'block';
            listaRespostas.innerHTML = '';
            
            respostas.forEach((item) => {
                const li = document.createElement('li');
                li.innerHTML = `<strong>Pergunta:</strong> ${item.pergunta} <br> <strong>Resposta:</strong> <span style="color: ${item.resposta === 'SIM' ? '#2ecc71' : '#e74c3c'}">${item.resposta}</span>`;
                listaRespostas.appendChild(li);
            });
        }

        // Inicializa o questionário
        atualizarPergunta();
    </script>
</body>
</html>
