<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acessibilidade Ocular - Questionário</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            color: #333;
            user-select: none; /* Impede a seleção acidental de texto ao clicar rapidamente */
        }

        header, footer {
            background-color: #2c3e50;
            color: white;
            padding: 1rem;
        }

        main {
            padding: 2rem;
            max-width: 600px;
            margin: auto;
        }

        .instrucoes {
            background-color: #e0e0e0;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .img-simbolo {
            max-width: 200px;
            height: auto;
            margin: 15px 0;
            border-radius: 8px;
        }

        .pergunta-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .respostas-log {
            margin-top: 20px;
            text-align: left;
            background: #fff;
            padding: 15px;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <header>
        <h1>Acessibilidade Ocular</h1>
        <nav>
            <a href="#" style="color: white;">Início</a>
        </nav>
    </header>

    <main>
        <h2>Questionário Interativo</h2>
        
        <div class="instrucoes">
            <p><strong>Como responder:</strong></p>
            <p>Clique <strong>ESQUERDO</strong> = NÃO</p>
            <p>Clique <strong>DIREITO</strong> = SIM</p>
        </div>

        <section>
            <article class="pergunta-card" id="area-clique">
                <img 
                    src="https://cloudfront-us-east-1.images.arcpublishing.com/estadao/QDNK2LEF4NI5HOKE2JLFTVOGSM.jpg" 
                    alt="Símbolo de acessibilidade" 
                    class="img-simbolo"
                >
                <p id="texto-pergunta" style="font-size: 1.2rem; font-weight: bold;">Carregando pergunta...</p>
            </article>
        </section>

        <div class="respostas-log" id="log-container" style="display: none;">
            <h3>Resultados:</h3>
            <ul id="lista-respostas"></ul>
        </div>
    </main>

    <footer>
        <p>Projeto feito por Oséias</p>
    </footer>

    <script>
        const perguntas = [
            "Você precisa de ajustes de contraste para ler com clareza?",
            "Você utiliza leitores de tela durante a navegação?",
            "Sente facilidade para navegar usando comandos do mouse?",
            "Deseja salvar suas respostas ao final?"
        ];

        let indiceAtual = 0;
        const respostas = [];

        const elementoPergunta = document.getElementById('texto-pergunta');
        const areaClique = document.getElementById('area-clique');
        const logContainer = document.getElementById('log-container');
        const listaRespostas = document.getElementById('lista-respostas');

        function atualizarPergunta() {
            if (indiceAtual < perguntas.length) {
                elementoPergunta.textContent = perguntas[indiceAtual];
            } else {
                exibirResultados();
            }
        }

        function registrarResposta(resposta) {
            if (indiceAtual < perguntas.length) {
                respostas.push({
                    pergunta: perguntas[indiceAtual],
                    resposta: resposta
                });
                indiceAtual++;
                atualizarPergunta();
            }
        }

        // Impede o menu de contexto padrão no clique direito dentro da área do questionário
        areaClique.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            registrarResposta('SIM');
        });

        // Intercepta o clique esquerdo
        areaClique.addEventListener('click', function(e) {
            // Garante que o evento dispara apenas com o botão principal (esquerdo)
            if (e.button === 0) {
                registrarResposta('NÃO');
            }
        });

        function exibirResultados() {
            areaClique.style.display = 'none';
            logContainer.style.display = 'block';
            listaRespostas.innerHTML = '';
            
            respostas.forEach((item) => {
                const li = document.createElement('li');
                li.textContent = `${item.pergunta} — Resposta: ${item.resposta}`;
                listaRespostas.appendChild(li);
            });
        }

        // Inicializa o questionário
        atualizarPergunta();
    </script>
</body>
</html>
