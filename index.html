<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Acessibilidade Ocular</title>
</head>

<body onclick="registrarCliqueGlobal(event)">
    <header>
        <h1>Site para auxiliar quem precisa</h1>
        <nav>
            <a href="#">Início</a>
        </nav>
    </header>

    <main>
        <h2>Dar Visão</h2>

        <div id="wrapper-barra-tempo" class="wrapper-barra-tempo">
            <div id="barra-tempo" class="barra-tempo"></div>
        </div>

        <section>
            <article>
                <div class="container-opcoes">
                    
                    <div id="opcao-0" class="bloco-opcao">
                        <img
                            src="image_JLJ26-.png"
                            alt="Símbolo de acessibilidade"
                            class="img-simbolo acessibilidade"
                        >
                        <p>Veja como a acessibilidade é!</p>
                    </div>

                    <div id="opcao-1" class="bloco-opcao">
                        <img
                            src="image_JLJ26-.png"
                            alt="Símbolo de acessibilidade"
                            class="img-simbolo acessibilidade"
                        >
                        <p>Site de alguma coisa assim, que fui colocado para fazer.</p>
                    </div>

                </div>
            </article>
        </section>
    </main>

    <footer>
        <p>Projeto feito por Oséias</p>
    </footer>

    <script>
        let indiceFocado = -1;
        let temporizadorConfirmacao = null;
        let intervaloProgresso = null;
        let selecaoBloqueada = false;

        const TEMPO_ESPERA_MS = 3000; 
        const TOTAL_OPCOES = 2;       

        const barraTempo = document.getElementById('barra-tempo');
        const wrapperBarra = document.getElementById('wrapper-barra-tempo');

        function registrarCliqueGlobal(event) {
            if (selecaoBloqueada) return;

            limparCronometros();

            indiceFocado++;
            if (indiceFocado >= TOTAL_OPCOES) {
                indiceFocado = 0;
            }

            for (let i = 0; i < TOTAL_OPCOES; i++) {
                const elemento = document.getElementById(`opcao-${i}`);
                if (i === indiceFocado) {
                    elemento.classList.add('foco-varredura');
                } else {
                    elemento.classList.remove('foco-varredura');
                }
            }

            dispararContagemRegressiva();
        }

        function dispararContagemRegressiva() {
            wrapperBarra.style.display = 'block';
            barraTempo.style.width = '0%';
            
            let tempoDecorrido = 0;
            const intervaloAtualizacao = 50; 

            intervaloProgresso = setInterval(() => {
                tempoDecorrido += intervaloAtualizacao;
                const porcentagem = (tempoDecorrido / TEMPO_ESPERA_MS) * 100;
                barraTempo.style.width = `${porcentagem}%`;
                
                if (tempoDecorrido >= TEMPO_ESPERA_MS) {
                    clearInterval(intervaloProgresso);
                }
            }, intervaloAtualizacao);

            temporizadorConfirmacao = setTimeout(() => {
                finalizarSelecao();
            }, TEMPO_ESPERA_MS);
        }

        function limparCronometros() {
            if (temporizadorConfirmacao) clearTimeout(temporizadorConfirmacao);
            if (intervaloProgresso) clearInterval(intervaloProgresso);
        }

        function finalizarSelecao() {
            selecaoBloqueada = true;
            wrapperBarra.style.display = 'none';

            const elementoSelecionado = document.getElementById(`opcao-${indiceFocado}`);
            if (elementoSelecionado) {
                elementoSelecionado.classList.remove('foco-varredura');
                elementoSelecionado.classList.add('confirmado');
            }
        }
    </script>
</body>
</html>
