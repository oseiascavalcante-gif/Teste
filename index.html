<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acessibilidade Ocular - Questionário Acessível</title>
    <style>
        /* VARIÁVEIS DO TEMA ESCURO (PADRÃO) */
        :root {
            --bg-principal: #070d14;
            --bg-card: #0e1a24;
            --bg-card-hover: #152635;
            --azul-neon: #00d2ff;
            --azul-borda: #1e3d59;
            --verde-sucesso: #00ff88;
            --vermelho-erro: #ff4a4a;
            --texto-branco: #ffffff;
            --texto-cinza: #94a3b8;
            --cor-foco: #00d2ff;
            --escala-zoom: 1; /* Controle dinâmico de zoom */
        }

        /* VARIÁVEIS DO TEMA CLARO */
        [data-tema="claro"] {
            --bg-principal: #f1f5f9;
            --bg-card: #ffffff;
            --bg-card-hover: #f8fafc;
            --azul-neon: #0284c7;
            --azul-borda: #93c5fd;
            --verde-sucesso: #16a34a;
            --vermelho-erro: #dc2626;
            --texto-branco: #0f172a;
            --texto-cinza: #475569;
            --cor-foco: #0284c7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            text-align: center;
            background-color: var(--bg-principal); 
            color: var(--texto-branco); 
            font-size: 24px; 
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease, transform 0.2s ease;
            
            /* Suporte para redimensionamento e zoom de tela */
            zoom: var(--escala-zoom);
            transform-origin: top center;
        }

        header {
            background-color: var(--bg-card);
            padding: 2rem 1.5rem;
            border-bottom: 2px solid var(--azul-borda);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        header h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            color: var(--texto-branco);
        }

        .header-controles {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        nav a {
            color: var(--azul-neon);
            font-size: 1.5rem;
            font-weight: 600;
            text-decoration: none;
        }

        /* PAINEL DE CONTROLE ACESSÍVEL (TEMA E ZOOM) */
        .grupo-controles {
            display: flex;
            gap: 8px;
            background-color: var(--bg-principal);
            padding: 6px 12px;
            border-radius: 20px;
            border: 2px solid var(--azul-borda);
        }

        .btn-controle {
            background-color: transparent;
            border: 1px solid var(--azul-borda);
            color: var(--texto-branco);
            padding: 6px 12px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-controle:hover, .btn-controle:focus-visible {
            background-color: var(--bg-card-hover);
            border-color: var(--azul-neon);
            color: var(--azul-neon);
        }

        nav a:focus-visible, .btn-controle:focus-visible {
            outline: 3px solid var(--cor-foco);
            outline-offset: 4px;
        }

        main {
            padding: 3rem 1.5rem;
            max-width: 800px; 
            width: 100%;
            margin: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 2.5rem;
        }

        h2 {
            font-size: 2.4rem;
            font-weight: 700;
            color: var(--texto-branco);
        }

        .instrucoes {
            background-color: var(--bg-card);
            padding: 30px;
            border: 2px solid var(--azul-borda); 
            border-radius: 20px;
            text-align: left;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .instrucoes p {
            font-size: 1.6rem;
            margin-bottom: 12px;
            color: var(--texto-cinza);
        }

        .instrucoes strong {
            color: var(--azul-neon);
            font-size: 1.7rem;
        }

        .pergunta-card {
            background: var(--bg-card);
            padding: 40px 30px;
            border-radius: 24px;
            border: 2px solid var(--azul-borda); 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            width: 100%;
            min-height: 400px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .img-simbolo {
            width: 100%;
            max-width: 200px;
            height: auto;
            filter: drop-shadow(0px 10px 20px rgba(0, 210, 255, 0.2));
        }

        #texto-pergunta {
            font-size: 2.3rem; 
            font-weight: 700;
            color: var(--texto-branco);
        }

        .botoes-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            width: 100%;
            justify-content: center;
        }

        .btn-resposta {
            padding: 15px 40px;
            font-size: 1.8rem;
            font-weight: bold;
            border-radius: 12px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 160px;
        }

        .btn-nao {
            background-color: transparent;
            border-color: var(--vermelho-erro);
            color: var(--vermelho-erro);
        }

        .btn-nao:hover, .btn-nao:focus-visible {
            background-color: var(--vermelho-erro);
            color: #ffffff;
        }

        .btn-sim {
            background-color: var(--verde-sucesso);
            color: #ffffff;
        }

        .btn-sim:hover, .btn-sim:focus-visible {
            opacity: 0.9;
            border-color: var(--texto-branco);
        }

        .btn-resposta:focus-visible {
            outline: 4px solid var(--cor-foco);
            outline-offset: 4px;
        }

        .respostas-log {
            text-align: left;
            background: var(--bg-card);
            padding: 40px;
            border-radius: 24px;
            border: 2px solid var(--azul-borda);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .respostas-log h3 {
            font-size: 2.2rem;
            color: var(--verde-sucesso);
            margin-bottom: 25px;
            border-bottom: 2px solid var(--azul-borda);
            padding-bottom: 15px;
        }

        .respostas-log ul {
            list-style: none;
        }

        .respostas-log li {
            font-size: 1.6rem;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--azul-borda);
            padding-bottom: 15px;
            color: var(--texto-cinza);
        }

        footer {
            background-color: var(--bg-card);
            padding: 2rem 1rem;
            border-top: 2px solid var(--azul-borda);
            color: var(--texto-cinza);
            font-size: 1.2rem;
            margin-top: auto;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
    </style>
</head>

<body>
    <header>
        <h1>Acessibilidade Ocular</h1>
        <div class="header-controles">
            <nav>
                <a href="#">Início</a>
            </nav>
            
            <div class="grupo-controles" aria-label="Controle de Tamanho da Tela">
                <button class="btn-controle" onclick="alterarZoom(-0.1)" aria-label="Diminuir Zoom">A-</button>
                <button class="btn-controle" onclick="redefinirZoom()" aria-label="Redefinir Zoom para 100%">100%</button>
                <button class="btn-controle" onclick="alterarZoom(0.1)" aria-label="Aumentar Zoom">A+</button>
            </div>

            <button class="btn-controle" id="btn-tema" onclick="alternarTema()" aria-label="Alternar modo claro e escuro">
                ☀️ Modo Claro
            </button>
        </div>
    </header>

    <main>
        <h2>Questionário Interativo</h2>
        
        <section class="instrucoes" aria-label="Instruções de Navegação">
            <p><strong>Como responder pelo Teclado ou Tela:</strong></p>
            <p>⌨️ Tecla <strong>N</strong>, <strong>Seta Esquerda</strong> ou o botão <strong>NÃO</strong></p>
            <p>⌨️ Tecla <strong>S</strong>, <strong>Seta Direita</strong> ou o botão <strong>SIM</strong></p>
        </section>

        <section id="area-questionario">
            <article class="pergunta-card">
                <img 
                    src="image_Qtzjut.png" 
                    alt="Símbolo de Acessibilidade Ocular" 
                    class="img-simbolo"
                >
                <p id="texto-pergunta" aria-live="polite" aria-atomic="true">Carregando questionário...</p>

                <div class="botoes-container">
                    <button class="btn-resposta btn-nao" id="btn-nao" onclick="registrarResposta('NÃO')">NÃO (N)</button>
                    <button class="btn-resposta btn-sim" id="btn-sim" onclick="registrarResposta('SIM')">SIM (S)</button>
                </div>
            </article>
        </section>

        <div class="respostas-log" id="log-container" style="display: none;" tabindex="-1">
            <h3>Resultados do Questionário</h3>
            <ul id="lista-respostas"></ul>
        </div>
    </main>

    <footer>
        <p>Projeto desenvolvido com foco em acessibilidade por Oséias</p>
    </footer>

    <script>
        const perguntas = [
            "Você precisa de ajustes de contraste para ler com clareza?",
            "Você utiliza leitores de tela durante a navegação?",
            "Sente facilidade para navegar usando comandos do mouse?",
            "Deseja salvar suas respostas ao final?"
        ];

        let indiceAtual = 0;
        const respostas = [];
        let explicouInstrucoes = false; 
        let encerrado = false; 
        let nivelZoomAtual = 1.0;

        const elementoPergunta = document.getElementById('texto-pergunta');
        const areaQuestionario = document.getElementById('area-questionario');
        const logContainer = document.getElementById('log-container');
        const listaRespostas = document.getElementById('lista-respostas');
        const btnTema = document.getElementById('btn-tema');

        /* FUNÇÕES DE ZOOM DA INTERFACE */
        function alterarZoom(delta) {
            // Limita o zoom entre 80% (0.8) e 160% (1.6)
            const novoZoom = Math.min(Math.max(nivelZoomAtual + delta, 0.8), 1.6);
            nivelZoomAtual = parseFloat(novoZoom.toFixed(1));
            
            document.documentElement.style.setProperty('--escala-zoom', nivelZoomAtual);
            falarTexto(`Zoom em ${Math.round(nivelZoomAtual * 100)} porcento`);
        }

        function redefinirZoom() {
            nivelZoomAtual = 1.0;
            document.documentElement.style.setProperty('--escala-zoom', nivelZoomAtual);
            falarTexto("Zoom redefinido para cem porcento");
        }

        /* ALTERNÂNCIA DE TEMA CLARO / ESCURO */
        function alternarTema() {
            const temaAtual = document.documentElement.getAttribute('data-tema');
            
            if (temaAtual === 'claro') {
                document.documentElement.removeAttribute('data-tema');
                btnTema.textContent = '☀️ Modo Claro';
                falarTexto("Modo escuro ativado");
            } else {
                document.documentElement.setAttribute('data-tema', 'claro');
                btnTema.textContent = '🌙 Modo Escuro';
                falarTexto("Modo claro ativado");
            }
        }

        function falarTexto(texto, callback) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const mensagem = new SpeechSynthesisUtterance(texto);
                mensagem.lang = 'pt-BR';
                mensagem.rate = 1.0;   
                
                if (callback) {
                    mensagem.onend = callback;
                }
                window.speechSynthesis.speak(mensagem);
            }
        }

        function iniciarOuAtualizar() {
            if (!explicouInstrucoes) {
                explicouInstrucoes = true;
                const textoInstrucao = "Bem-vindo ao questionário acessível. Você pode usar o teclado, os botões ou ajustar o zoom do site no topo.";
                falarTexto(textoInstrucao, () => {
                    atualizarPergunta();
                });
            } else {
                atualizarPergunta();
            }
        }

        function atualizarPergunta() {
            if (indiceAtual < perguntas.length) {
                const proximaPergunta = perguntas[indiceAtual];
                elementoPergunta.textContent = proximaPergunta;
                falarTexto(proximaPergunta);
            } else {
                exibirResultados();
            }
        }

        function registrarResposta(resposta) {
            if (indiceAtual < perguntas.length && !encerrado) {
                respostas.push({
                    pergunta: perguntas[indiceAtual],
                    resposta: resposta
                });
                falarTexto(`Você respondeu: ${resposta}`);
                indiceAtual++;
                setTimeout(atualizarPergunta, 800);
            }
        }

        window.addEventListener('keydown', function(e) {
            if (encerrado) return;
            const tecla = e.key.toLowerCase();
            
            if (tecla === 's' || e.key === 'ArrowRight') {
                registrarResposta('SIM');
            } else if (tecla === 'n' || e.key === 'ArrowLeft') {
                registrarResposta('NÃO');
            }
        });

        function exibirResultados() {
            encerrado = true;
            areaQuestionario.style.display = 'none';
            logContainer.style.display = 'block';
            logContainer.focus();
            
            listaRespostas.innerHTML = '';
            falarTexto("Questionário concluído. Seus resultados estão na tela.");
            
            respostas.forEach((item) => {
                const li = document.createElement('li');
                li.innerHTML = `<strong>Pergunta:</strong> ${item.pergunta} <br> <strong>Resposta:</strong> <span style="color: ${item.resposta === 'SIM' ? 'var(--verde-sucesso)' : 'var(--vermelho-erro)'}; font-weight: bold;">${item.resposta}</span>`;
                listaRespostas.appendChild(li);
            });
        }

        iniciarOuAtualizar();
    </script>
</body>
</html>
